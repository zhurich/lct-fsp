services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fsp
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Почтовая ловушка: письма с подтверждением регистрации видны в веб-интерфейсе на порту 8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fsp:${POSTGRES_PASSWORD:-fsp}@db:5432/fsp
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
